name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on branches and PRs, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck, lint (including the src/core purity rules), tests, build, bundle budget
      - run: npm run check
      # End-to-end in real Chrome (preinstalled on the runner): first run, care, mini-game, reload, backup.
      - run: npm run smoke

  # Preview hosting for testers: GitHub Pages, from main only.
  # One-time setup by the developer: repo Settings, Pages, Source = "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Project sites are served from /<repo-name>/, so the build needs that base path.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: where the in-app feedback goes (repo Settings, Secrets and variables, Variables).
          VITE_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          VITE_FEEDBACK_FORM_URL: ${{ vars.FEEDBACK_FORM_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
